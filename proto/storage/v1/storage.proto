syntax = "proto3";

// The storage module: the VFS that indexes the files of the locations into
// IDs. Only the control plane is here; the content of the files is served
// as plain HTTP, at GET/HEAD /locations/{location_id}/files/{file_id}.
package storage.v1;

import "google/protobuf/timestamp.proto";

service StorageService {
  // CreateLocation registers a location. It fails with ALREADY_EXISTS if the
  // directory is inside, or contains, another location.
  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse);
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse);
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse);
  // DeleteLocation removes a location and its files from the index.
  rpc DeleteLocation(DeleteLocationRequest) returns (DeleteLocationResponse);
  // ScanLocation synchronizes the index with the files of the location. If
  // the location is not accessible, the index is left untouched.
  rpc ScanLocation(ScanLocationRequest) returns (ScanLocationResponse);
  // ResyncLocation publishes again the events of every file of the location
  // and of every analysis of their current content.
  rpc ResyncLocation(ResyncLocationRequest) returns (ResyncLocationResponse);

  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  // ListFiles lists the files of a location ordered by path.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ListSiblings lists the other indexed files in the same directory as a
  // file (e.g. external subtitles).
  rpc ListSiblings(ListSiblingsRequest) returns (ListSiblingsResponse);
  // ResolveFile returns the URL to read the content of a file from. It
  // accepts GET and HEAD, with Range.
  rpc ResolveFile(ResolveFileRequest) returns (ResolveFileResponse);
}

// Location is a directory registered by the operator and accessed through a
// driver. Locations never overlap.
message Location {
  // id is a UUIDv7.
  string id = 1;
  string driver = 2;
  // options are driver specific (e.g. "dir" for the local driver).
  map<string, string> options = 3;
  google.protobuf.Timestamp created_at = 4;
}

// File is an indexed file. Its ID is generated by the storage on first
// indexing and is the only way other modules refer to files.
message File {
  // id is a UUIDv7.
  string id = 1;
  string location_id = 2;
  // path is slash-separated and relative to the location.
  string path = 3;
  int64 size = 4;
  google.protobuf.Timestamp mod_time = 5;
  // inode is zero when the driver does not support inodes.
  uint64 inode = 6;
}

// Sibling is a file in the same directory as another one.
message Sibling {
  string file_id = 1;
  // path is relative to the location.
  string path = 2;
}

// ScanResult summarizes a location scan.
message ScanResult {
  int32 added = 1;
  int32 changed = 2;
  int32 moved = 3;
  int32 removed = 4;
}

message CreateLocationRequest {
  string driver = 1;
  // options are driver specific (e.g. "dir" for the local driver).
  map<string, string> options = 2;
}

message CreateLocationResponse {
  Location location = 1;
}

message GetLocationRequest {
  string id = 1;
}

message GetLocationResponse {
  Location location = 1;
}

message ListLocationsRequest {}

message ListLocationsResponse {
  repeated Location locations = 1;
}

message DeleteLocationRequest {
  string id = 1;
}

message DeleteLocationResponse {}

message ScanLocationRequest {
  string id = 1;
}

message ScanLocationResponse {
  ScanResult result = 1;
}

message ResyncLocationRequest {
  string id = 1;
}

message ResyncLocationResponse {}

message GetFileRequest {
  string id = 1;
}

message GetFileResponse {
  File file = 1;
}

message ListFilesRequest {
  string location_id = 1;
  // limit is the maximum number of files returned. Zero, or a value above
  // the maximum page (1000), means the maximum page.
  int32 limit = 2;
  // offset is the number of files to skip.
  int32 offset = 3;
}

message ListFilesResponse {
  repeated File files = 1;
}

message ListSiblingsRequest {
  string id = 1;
}

message ListSiblingsResponse {
  repeated Sibling siblings = 1;
}

message ResolveFileRequest {
  string id = 1;
}

message ResolveFileResponse {
  // url is "http://<storage address>/locations/{location_id}/files/{file_id}".
  string url = 1;
}
