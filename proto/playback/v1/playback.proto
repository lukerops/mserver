syntax = "proto3";

// The playback module: the playback sessions of the clients, from start to
// stop. It knows nothing about the APIs that expose it: the item and the
// file being played arrive from the caller.
//
// The active sessions live only in the key-value store shared by every
// instance of the module. A session ends when the client stops it or when
// it receives no report for the session timeout.
package playback.v1;

import "google/protobuf/timestamp.proto";

service PlaybackService {
  // StartSession creates a session, with an id generated by the server, and
  // publishes its started event.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // ListSessions lists the active sessions, oldest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // ReportProgress reports the position and the pause state of a session.
  // It publishes the progressed event, and the paused or resumed one when
  // the pause state changes.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
  // HeartbeatSession keeps a session alive without changing it.
  rpc HeartbeatSession(HeartbeatSessionRequest) returns (HeartbeatSessionResponse);
  // StopSession ends a session and publishes its stopped event.
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);
}

// Session is an active playback session.
message Session {
  // id is a UUIDv7.
  string id = 1;
  string account_id = 2;
  string profile_id = 3;
  string device_id = 4;
  // item_id is the library item (movie or episode) being played.
  string item_id = 5;
  // file_id is the storage file being played.
  string file_id = 6;
  // play_method is "direct_play".
  string play_method = 7;
  int64 position_ms = 8;
  bool paused = 9;
  // watched_ms is the wall-clock time the session played (not paused), up
  // to last_seen_at.
  int64 watched_ms = 10;
  // sequence is the sequence of the last event of the session.
  int64 sequence = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // last_seen_at is the last report (progress or heartbeat). The session is
  // stopped when it is older than the session timeout.
  google.protobuf.Timestamp last_seen_at = 14;
}

message StartSessionRequest {
  string account_id = 1;
  string profile_id = 2;
  string device_id = 3;
  string item_id = 4;
  string file_id = 5;
  // play_method must be "direct_play".
  string play_method = 6;
  int64 position_ms = 7;
  bool paused = 8;
}

message StartSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  // limit is the size of the page; zero is the maximum page.
  int32 limit = 1;
  int32 offset = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message ReportProgressRequest {
  string id = 1;
  int64 position_ms = 2;
  bool paused = 3;
}

message ReportProgressResponse {
  Session session = 1;
}

message HeartbeatSessionRequest {
  string id = 1;
}

message HeartbeatSessionResponse {}

message StopSessionRequest {
  string id = 1;
  // position_ms is the final position; when unset, the last reported one is
  // kept.
  optional int64 position_ms = 2;
}

message StopSessionResponse {}
