info:
  name: get
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/identity.v1.IdentityService/GetAccount"
  body:
    type: json
    data: |-
      {
        "id": "{{AccountID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
