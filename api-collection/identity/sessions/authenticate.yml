info:
  name: authenticate
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/identity.v1.IdentityService/Authenticate"
  body:
    type: json
    data: |-
      {
        "login": "admin",
        "password": "secret123",
        "device": {
          "identifier": "bruno",
          "name": "Bruno",
          "client": "Bruno",
          "version": "1.0"
        }
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.session.id
        method: jsonq
      variable:
        name: SessionID
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: Token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
