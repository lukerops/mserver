info:
  name: list
  type: http
  seq: 2

http:
  method: POST
  url: "{{BaseURL}}/identity.v1.IdentityService/ListProfiles"
  body:
    type: json
    data: |-
      {
        "accountId": "{{AccountID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
