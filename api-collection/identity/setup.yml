info:
  name: setup
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/identity.v1.IdentityService/Setup"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "email": "a@b.c",
        "password": "secret123",
        "profile": {
          "handle": "lucas",
          "displayName": "Lucas"
        }
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.account.id
        method: jsonq
      variable:
        name: AccountID
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.profile.id
        method: jsonq
      variable:
        name: ProfileID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
