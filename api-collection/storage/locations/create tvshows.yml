info:
  name: create tvshows
  type: http
  seq: 2

http:
  method: POST
  url: "{{BaseURL}}/storage.v1.StorageService/CreateLocation"
  body:
    type: json
    data: |-
      {
        "driver": "local",
        "options": {
          "dir": "/media/tvshows"
        }
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.location.id
        method: jsonq
      variable:
        name: TVLocationID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
