info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/v1/locations"
  body:
    type: json
    data: |-
      {
        "driver": "local",
        "options": {
          "dir": "/media/movies"
        }
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: LocationID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
