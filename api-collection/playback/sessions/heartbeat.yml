  url: "{{BaseURL}}/playback.v1.PlaybackService/HeartbeatSession"
  body:
    type: json
    data: |-
      {
        "id": "{{PlaybackSessionID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
