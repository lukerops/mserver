info:
  name: progress
  type: http
  seq: 4

http:
  method: POST
  url: "{{BaseURL}}/playback.v1.PlaybackService/ReportProgress"
  body:
    type: json
    data: |-
      {
        "id": "{{PlaybackSessionID}}",
        "positionMs": 60000,
        "paused": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
