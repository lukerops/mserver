info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/playback.v1.PlaybackService/StartSession"
  body:
    type: json
    data: |-
      {
        "accountId": "{{AccountID}}",
        "profileId": "{{ProfileID}}",
        "deviceId": "0198c3a0-0000-7000-8000-000000000001",
        "itemId": "{{MovieID}}",
        "fileId": "{{MovieFileID}}",
        "playMethod": "direct_play",
        "positionMs": 0,
        "paused": false
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.session.id
        method: jsonq
      variable:
        name: PlaybackSessionID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
