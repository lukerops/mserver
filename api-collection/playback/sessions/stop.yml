info:
  name: stop
  type: http
  seq: 6

http:
  method: POST
  url: "{{BaseURL}}/playback.v1.PlaybackService/StopSession"
  body:
    type: json
    data: |-
      {
        "id": "{{PlaybackSessionID}}",
        "positionMs": 90000
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
