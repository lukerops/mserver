info:
  name: create movies
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/library.v1.LibraryService/CreateLibrary"
  body:
    type: json
    data: |-
      {
        "name": "Filmes",
        "mediaType": "movies",
        "locationIds": [
          "{{MovieLocationID}}"
        ]
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.library.id
        method: jsonq
      variable:
        name: MovieLibraryID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
