info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/v1/libraries/{{TVLibraryID}}/series?sort_by=title"
  params:
    - name: sort_by
      value: title
      type: query
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.series[0].id
        method: jsonq
      variable:
        name: SeriesID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
