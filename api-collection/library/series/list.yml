info:
  name: list
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/library.v1.LibraryService/ListSeries"
  body:
    type: json
    data: |-
      {
        "libraryId": "{{TVLibraryID}}",
        "sortBy": "title",
        "limit": 50
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.series[0].id
        method: jsonq
      variable:
        name: SeriesID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
