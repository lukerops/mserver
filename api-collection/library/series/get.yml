info:
  name: get
  type: http
  seq: 2

http:
  method: POST
  url: "{{BaseURL}}/library.v1.LibraryService/GetSeries"
  body:
    type: json
    data: |-
      {
        "libraryId": "{{TVLibraryID}}",
        "id": "{{SeriesID}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
