info:
  name: create tvshows
  type: http
  seq: 3

http:
  method: POST
  url: "{{BaseURL}}/library.v1.LibraryService/CreateLibrary"
  body:
    type: json
    data: |-
      {
        "name": "Séries",
        "mediaType": "tvshows",
        "locationIds": [
          "{{TVLocationID}}"
        ]
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.library.id
        method: jsonq
      variable:
        name: TVLibraryID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
