info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/v1/libraries"
  body:
    type: json
    data: |-
      {
        "name": "Movies",
        "media_type": "movies",
        "location_ids": [
          "{{LocationID}}"
        ]
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: LibraryID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
