info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/v1/libraries/{{MovieLibraryID}}/movies?sort_by=added&order=desc"
  params:
    - name: sort_by
      value: added
      type: query
    - name: order
      value: desc
      type: query
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.movies[0].id
        method: jsonq
      variable:
        name: MovieID
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.movies[0].file_id
        method: jsonq
      variable:
        name: MovieFileID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
