info:
  name: list
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseURL}}/library.v1.LibraryService/ListMovies"
  body:
    type: json
    data: |-
      {
        "libraryId": "{{MovieLibraryID}}",
        "sortBy": "added",
        "descending": true,
        "limit": 50
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.movies[0].id
        method: jsonq
      variable:
        name: MovieID
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.movies[0].fileId
        method: jsonq
      variable:
        name: MovieFileID
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
