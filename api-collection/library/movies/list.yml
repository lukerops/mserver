info:
  name: list
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseURL}}/v1/movies?sort_by=added&order=desc"
  params:
    - name: sort_by
      value: added
      type: query
    - name: order
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
